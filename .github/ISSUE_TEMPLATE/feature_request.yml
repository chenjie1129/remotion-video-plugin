name: Feature request
description: Suggest a focused improvement to the plugin or skill workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What video-creation job is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: A safe prompt, project shape, or expected result helps us evaluate the idea.
