name: Harness and Remotion integration

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: remotion-video-plugin

      - name: Check out DeepSeek Harness
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            remotion-video-plugin/package-lock.json
            remotion-video-plugin/demo/package-lock.json

      - name: Enable Harness package manager
        working-directory: deepseek-harness
        run: corepack enable

      - name: Install and build Harness
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin and demo
        working-directory: remotion-video-plugin
        run: |
          npm ci
          npm --prefix demo ci

      - name: Run real registry, subprocess, still, and video smoke
        working-directory: remotion-video-plugin
        env:
          DEEPSEEK_HARNESS_CHECKOUT: ${{ github.workspace }}/deepseek-harness
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Install, boot, and inspect an isolated Harness Web profile
        working-directory: remotion-video-plugin
        env:
          DEEPSEEK_HARNESS_CHECKOUT: ${{ github.workspace }}/deepseek-harness
          DSH_HOME: ${{ runner.temp }}/dsh-remotion-web
          HARNESS_WEB_URL: http://127.0.0.1:3091
          HARNESS_SCREENSHOT_PATH: demo/out/harness-plugin-inventory-v0.4.png
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          package_file="$(node -p "const p=require('./package.json'); p.name.slice(1).replace('/', '-') + '-' + p.version + '.tgz'")"
          npm pack --pack-destination "$RUNNER_TEMP"
          plugin_tarball="$RUNNER_TEMP/$package_file"
          test -f "$plugin_tarball"

          cd "$DEEPSEEK_HARNESS_CHECKOUT"
          node --import tsx/esm apps/cli/src/bin.ts plugin --profile web add "$plugin_tarball"
          config="$(node --import tsx/esm apps/cli/src/bin.ts --profile web --dump-config)"
          grep -q 'id: remotion-video-plugin' <<<"$config"
          grep -q 'id: remotion-video-tools' <<<"$config"
          corepack pnpm --dir "$DSH_HOME/profiles/web" peers check

          web_log="$RUNNER_TEMP/remotion-harness-web.log"
          node --import tsx/esm apps/cli/src/bin.ts web --port 3091 >"$web_log" 2>&1 &
          web_pid=$!
          trap 'status=$?; kill "$web_pid" 2>/dev/null || true; wait "$web_pid" 2>/dev/null || true; cat "$web_log"; exit "$status"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$HARNESS_WEB_URL" >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$HARNESS_WEB_URL")" = '200'

          cd "$GITHUB_WORKSPACE/remotion-video-plugin"
          node scripts/web-smoke.mjs

      - name: Upload render evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: remotion-tool-smoke-${{ github.sha }}
          path: |
            remotion-video-plugin/demo/out/tool-smoke.png
            remotion-video-plugin/demo/out/tool-smoke.mp4
            remotion-video-plugin/demo/out/harness-plugin-inventory-v0.4.png
          if-no-files-found: error
          retention-days: 14
