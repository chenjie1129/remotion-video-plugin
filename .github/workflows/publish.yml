name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish after CI and integration pass
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use a trusted-publishing capable npm CLI
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm --prefix demo ci
      - run: npm run check
      - name: Verify exact tag, published GitHub release, and release contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft)" = "false"
          npm run release:verify
      - name: Publish public package with provenance
        run: npm publish --access public
